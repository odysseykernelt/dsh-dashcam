name: CI

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  bundle-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild lib/client.js and diff against committed artifact
        run: |
          cp -r dsh-dashcam-host /tmp/hostbuild
          cd /tmp/hostbuild && node build.mjs
          diff -q /tmp/hostbuild/lib/client.js dsh-dashcam-host/lib/client.js
